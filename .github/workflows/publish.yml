# Publish @qldc/logger to the public npm registry on version tags (v*).
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
# Configure once on npmjs.com → package → Settings → Trusted Publisher:
#   Organization or user: (GitHub org that owns this repo)
#   Repository:           (this repository name)
#   Workflow filename:    publish.yml
#   Environment:          (leave blank)

name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@qldc"

      # setup-node writes `_authToken=${NODE_AUTH_TOKEN}` which breaks OIDC when
      # the env var is unset (empty token → npm 404 instead of trusted publish).
      - name: Prefer OIDC over empty token auth
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance
